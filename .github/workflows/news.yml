name: market news

# Started by the website server when it publishes the day's work list (queue/today.json), or by hand.
# Runs on GitHub's machines only. No secrets are used or stored.
on:
  push:
    paths: ["queue/**"]
  workflow_dispatch:

permissions:
  contents: write        # this repository only: replace branch 'data' with the latest results

concurrency:
  group: market-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests==2.32.3
      - name: "Fetch shard ${{ matrix.shard }} (one request at a time, 1-2 s gaps, stop switch)"
        working-directory: collector
        run: python news_fetch.py ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.json.gz
          retention-days: 2

  combine:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: python collector/combine.py
      - name: Publish results (branch 'data' holds only the latest file, so the repository never grows)
        run: |
          git config user.name "market-news-bot"
          git config user.email "market-news-bot@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -r -q --cached .
          git add -f results/latest.json.gz
          git commit -q -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin HEAD:data
